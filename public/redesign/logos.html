<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Logos — Praça Araguaia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bone:#F1EBDE;--paper:#FBF8F1;--rule:#D9CDB2;--ink:#1B1913;--muted:#7A6F58;
--olive:#3F4A24;--olive-deep:#26301A;--leather:#6E3E1E;--ochre:#B4863B;
--serif:'Fraunces',serif;--sans:'Hanken Grotesk',sans-serif;--mono:'IBM Plex Mono',monospace;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bone);color:var(--ink);font-family:var(--sans);padding:48px 40px}
h1{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:32px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;max-width:1100px}
.card{background:var(--paper);border:1px solid var(--rule);padding:30px}
.name{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--olive);margin-bottom:20px}
.row{display:flex;align-items:center;gap:18px;margin-bottom:22px}
.badge{width:64px;height:64px;flex:none}
.fav{width:24px;height:24px;flex:none}
.mini{width:16px;height:16px;flex:none}
.lockup{display:flex;align-items:center;gap:13px;margin-top:8px}
.lockup .mk{width:46px;height:46px;flex:none}
.word{font-family:var(--serif);font-size:25px;font-variation-settings:'opsz' 120,'wght' 480,'SOFT' 0,'WONK' 0;line-height:1;color:var(--ink)}
.sub{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
</style></head>
<body>
<h1>Praça Araguaia · opções de marca</h1>
<div class="grid">

  <!-- 1. Zebu -->
  <div class="card">
    <div class="name">1 · Zebu (Nelore)</div>
    <div class="row">
      <svg class="badge" viewBox="0 0 48 48">
        <rect width="48" height="48" rx="12" fill="#3F4A24"/>
        <g fill="none" stroke="#F1EBDE" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 17c-3-3-6-3-8-1 2 3 5 4 8 3"/>
          <path d="M33 17c3-3 6-3 8-1-2 3-5 4-8 3"/>
          <path d="M20 15c2-2.6 6-2.6 8 0"/>
          <path d="M12 21c-3 1.5-3.6 5-2 8 3.4 .4 6-2 6.5-5"/>
          <path d="M36 21c3 1.5 3.6 5 2 8-3.4 .4-6-2-6.5-5"/>
          <path d="M17 18c-1.6 2.4-2 5.6-1 9 1.4 4.6 4.4 7 8 7s6.6-2.4 8-7c1-3.4 .6-6.6-1-9"/>
        </g>
        <circle cx="21" cy="27" r="1.4" fill="#F1EBDE"/><circle cx="27" cy="27" r="1.4" fill="#F1EBDE"/>
      </svg>
      <svg class="fav" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#3F4A24"/><g fill="none" stroke="#F1EBDE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17c-3-3-6-3-8-1 2 3 5 4 8 3"/><path d="M33 17c3-3 6-3 8-1-2 3-5 4-8 3"/><path d="M12 21c-3 1.5-3.6 5-2 8 3.4 .4 6-2 6.5-5"/><path d="M36 21c3 1.5 3.6 5 2 8-3.4 .4-6-2-6.5-5"/><path d="M17 18c-1.6 2.4-2 5.6-1 9 1.4 4.6 4.4 7 8 7s6.6-2.4 8-7c1-3.4 .6-6.6-1-9"/></g><circle cx="21" cy="27" r="1.8" fill="#F1EBDE"/><circle cx="27" cy="27" r="1.8" fill="#F1EBDE"/></svg>
      <svg class="mini" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#3F4A24"/><g fill="none" stroke="#F1EBDE" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-3 1.5-3.6 5-2 8 3.4 .4 6-2 6.5-5"/><path d="M36 21c3 1.5 3.6 5 2 8-3.4 .4-6-2-6.5-5"/><path d="M17 18c-1.6 2.4-2 5.6-1 9 1.4 4.6 4.4 7 8 7s6.6-2.4 8-7c1-3.4 .6-6.6-1-9"/></g></svg>
      <span class="tag">64 · 24 · 16 px</span>
    </div>
    <div class="lockup">
      <svg class="mk" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#3F4A24"/><g fill="none" stroke="#F1EBDE" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17c-3-3-6-3-8-1 2 3 5 4 8 3"/><path d="M33 17c3-3 6-3 8-1-2 3-5 4-8 3"/><path d="M20 15c2-2.6 6-2.6 8 0"/><path d="M12 21c-3 1.5-3.6 5-2 8 3.4 .4 6-2 6.5-5"/><path d="M36 21c3 1.5 3.6 5 2 8-3.4 .4-6-2-6.5-5"/><path d="M17 18c-1.6 2.4-2 5.6-1 9 1.4 4.6 4.4 7 8 7s6.6-2.4 8-7c1-3.4 .6-6.6-1-9"/></g><circle cx="21" cy="27" r="1.4" fill="#F1EBDE"/><circle cx="27" cy="27" r="1.4" fill="#F1EBDE"/></svg>
      <div><div class="word">Praça Araguaia</div><div class="sub">Cotações do agro</div></div>
    </div>
  </div>

  <!-- 2. Ferro (monograma marca de gado) -->
  <div class="card">
    <div class="name">2 · Ferro (marca de gado)</div>
    <div class="row">
      <svg class="badge" viewBox="0 0 48 48">
        <rect width="48" height="48" rx="12" fill="#3F4A24"/>
        <path d="M24 12 C16 12 12 17 12 24 C12 31 16 36 24 36 C29 36 32 33.5 33.5 30" fill="none" stroke="#F1EBDE" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M24 19 L24 29 M24 24 L33 24" fill="none" stroke="#B4863B" stroke-width="3.2" stroke-linecap="round"/>
      </svg>
      <svg class="fav" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#3F4A24"/><path d="M24 12 C16 12 12 17 12 24 C12 31 16 36 24 36 C29 36 32 33.5 33.5 30" fill="none" stroke="#F1EBDE" stroke-width="4" stroke-linecap="round"/><path d="M24 19 L24 29 M24 24 L33 24" fill="none" stroke="#B4863B" stroke-width="4" stroke-linecap="round"/></svg>
      <svg class="mini" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#3F4A24"/><path d="M24 12 C16 12 12 17 12 24 C12 31 16 36 24 36 C29 36 32 33.5 33.5 30" fill="none" stroke="#F1EBDE" stroke-width="4.6" stroke-linecap="round"/><path d="M24 19 L24 29 M24 24 L33 24" fill="none" stroke="#B4863B" stroke-width="4.6" stroke-linecap="round"/></svg>
      <span class="tag">64 · 24 · 16 px</span>
    </div>
    <div class="lockup">
      <svg class="mk" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#3F4A24"/><path d="M24 12 C16 12 12 17 12 24 C12 31 16 36 24 36 C29 36 32 33.5 33.5 30" fill="none" stroke="#F1EBDE" stroke-width="3.2" stroke-linecap="round"/><path d="M24 19 L24 29 M24 24 L33 24" fill="none" stroke="#B4863B" stroke-width="3.2" stroke-linecap="round"/></svg>
      <div><div class="word">Praça Araguaia</div><div class="sub">Cotações do agro</div></div>
    </div>
  </div>

  <!-- 3. Sol da porteira -->
  <div class="card">
    <div class="name">3 · Sol da porteira</div>
    <div class="row">
      <svg class="badge" viewBox="0 0 48 48">
        <rect width="48" height="48" rx="12" fill="#3F4A24"/>
        <g stroke="#F1EBDE" stroke-width="2.2" stroke-linecap="round" fill="none">
          <path d="M15 29a9 9 0 0 1 18 0"/>
          <line x1="10" y1="33" x2="38" y2="33"/>
          <line x1="24" y1="12" x2="24" y2="15.5"/>
          <line x1="15.5" y1="15.5" x2="17.8" y2="18.4"/>
          <line x1="32.5" y1="15.5" x2="30.2" y2="18.4"/>
        </g>
        <path d="M10 33 q7 4 14 0 t14 0" stroke="#B4863B" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
      <svg class="fav" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#3F4A24"/><g stroke="#F1EBDE" stroke-width="3" stroke-linecap="round" fill="none"><path d="M15 29a9 9 0 0 1 18 0"/><line x1="11" y1="33" x2="37" y2="33"/><line x1="24" y1="12" x2="24" y2="15.5"/><line x1="15.5" y1="15.5" x2="17.8" y2="18.4"/><line x1="32.5" y1="15.5" x2="30.2" y2="18.4"/></g></svg>
      <svg class="mini" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#3F4A24"/><g stroke="#F1EBDE" stroke-width="3.6" stroke-linecap="round" fill="none"><path d="M15 29a9 9 0 0 1 18 0"/><line x1="11" y1="33" x2="37" y2="33"/></g></svg>
      <span class="tag">64 · 24 · 16 px</span>
    </div>
    <div class="lockup">
      <svg class="mk" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#3F4A24"/><g stroke="#F1EBDE" stroke-width="2.2" stroke-linecap="round" fill="none"><path d="M15 29a9 9 0 0 1 18 0"/><line x1="10" y1="33" x2="38" y2="33"/><line x1="24" y1="12" x2="24" y2="15.5"/><line x1="15.5" y1="15.5" x2="17.8" y2="18.4"/><line x1="32.5" y1="15.5" x2="30.2" y2="18.4"/></g><path d="M10 33 q7 4 14 0 t14 0" stroke="#B4863B" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      <div><div class="word">Praça Araguaia</div><div class="sub">Cotações do agro</div></div>
    </div>
  </div>

</div>
</body></html>

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Logos 2 — Praça Araguaia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bone:#F1EBDE;--paper:#FBF8F1;--rule:#D9CDB2;--ink:#1B1913;--muted:#7A6F58;--olive:#3F4A24;--leather:#6E3E1E;--ochre:#B4863B;
--serif:'Playfair Display',serif;--sans:'Archivo',sans-serif;--mono:'JetBrains Mono',monospace;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bone);color:var(--ink);font-family:var(--sans);padding:44px 40px}
h1{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.sub{font-family:var(--serif);font-size:26px;margin-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;max-width:1120px}
.card{background:var(--paper);border:1px solid var(--rule);padding:30px}
.name{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--olive);margin-bottom:22px}
.row{display:flex;align-items:center;gap:18px;margin-bottom:24px}
.b64{width:64px;height:64px}.b24{width:24px;height:24px}.b16{width:16px;height:16px}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.lock{display:flex;align-items:center;gap:13px}.lock svg{width:46px;height:46px}
.word{font-family:var(--serif);font-weight:600;font-size:25px;line-height:1;color:var(--ink)}
.wsub{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:5px}
</style></head>
<body>
<h1>Praça Araguaia · logos (traço afiado)</h1>
<div class="sub">A praça hoje.</div>
<div class="grid">

  <!-- A. Monograma serifado PA -->
  <div class="card">
    <div class="name">A · Monograma serifado</div>
    <div class="row">
      <svg class="b64" viewBox="0 0 48 48"><rect width="48" height="48" fill="#3F4A24"/><rect x="4" y="4" width="40" height="40" fill="none" stroke="#B4863B" stroke-width="0.8"/><text x="24" y="33" font-family="Playfair Display, serif" font-weight="700" font-size="22" fill="#F1EBDE" text-anchor="middle">PA</text></svg>
      <svg class="b24" viewBox="0 0 48 48"><rect width="48" height="48" fill="#3F4A24"/><text x="24" y="34" font-family="Playfair Display, serif" font-weight="700" font-size="26" fill="#F1EBDE" text-anchor="middle">PA</text></svg>
      <svg class="b16" viewBox="0 0 48 48"><rect width="48" height="48" fill="#3F4A24"/><text x="24" y="35" font-family="Playfair Display, serif" font-weight="700" font-size="28" fill="#F1EBDE" text-anchor="middle">PA</text></svg>
      <span class="tag">64 · 24 · 16</span>
    </div>
    <div class="lock"><svg viewBox="0 0 48 48"><rect width="48" height="48" fill="#3F4A24"/><rect x="4" y="4" width="40" height="40" fill="none" stroke="#B4863B" stroke-width="0.8"/><text x="24" y="33" font-family="Playfair Display, serif" font-weight="700" font-size="22" fill="#F1EBDE" text-anchor="middle">PA</text></svg><div><div class="word">Praça Araguaia</div><div class="wsub">Cotações do agro</div></div></div>
  </div>

  <!-- B. Chifre (longhorn) -->
  <div class="card">
    <div class="name">B · Chifre (longhorn)</div>
    <div class="row">
      <svg class="b64" viewBox="0 0 48 48"><rect width="48" height="48" fill="#3F4A24"/><g fill="none" stroke="#F1EBDE" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"><path d="M8 26 C 13 17, 19 19, 24 23 C 29 19, 35 17, 40 26"/><path d="M8 26 L 6 22 M40 26 L42 22"/><path d="M24 23 L24 33 M19 28 L29 28"/></g></svg>
      <svg class="b24" viewBox="0 0 48 48"><rect width="48" height="48" fill="#3F4A24"/><g fill="none" stroke="#F1EBDE" stroke-width="3" stroke-linecap="square"><path d="M8 26 C 13 17, 19 19, 24 23 C 29 19, 35 17, 40 26"/><path d="M24 23 L24 33 M19 28 L29 28"/></g></svg>
      <svg class="b16" viewBox="0 0 48 48"><rect width="48" height="48" fill="#3F4A24"/><g fill="none" stroke="#F1EBDE" stroke-width="4" stroke-linecap="square"><path d="M8 26 C 13 17, 19 19, 24 23 C 29 19, 35 17, 40 26"/></g></svg>
      <span class="tag">64 · 24 · 16</span>
    </div>
    <div class="lock"><svg viewBox="0 0 48 48"><rect width="48" height="48" fill="#3F4A24"/><g fill="none" stroke="#F1EBDE" stroke-width="2.2" stroke-linecap="square"><path d="M8 26 C 13 17, 19 19, 24 23 C 29 19, 35 17, 40 26"/><path d="M8 26 L 6 22 M40 26 L42 22"/><path d="M24 23 L24 33 M19 28 L29 28"/></g></svg><div><div class="word">Praça Araguaia</div><div class="wsub">Cotações do agro</div></div></div>
  </div>

  <!-- C. Boi frontal -->
  <div class="card">
    <div class="name">C · Cabeça de boi</div>
    <div class="row">
      <svg class="b64" viewBox="0 0 48 48"><rect width="48" height="48" fill="#3F4A24"/><g fill="none" stroke="#F1EBDE" stroke-width="2" stroke-linejoin="miter" stroke-linecap="square"><path d="M14 16 L8 10 M34 16 L40 10"/><path d="M14 16 L18 20 L14 24 L10 22 Z" fill="#F1EBDE"/><path d="M34 16 L30 20 L34 24 L38 22 Z" fill="#F1EBDE"/><path d="M16 18 L24 15 L32 18 L31 30 L24 36 L17 30 Z"/></g><circle cx="20.5" cy="24" r="1.4" fill="#F1EBDE"/><circle cx="27.5" cy="24" r="1.4" fill="#F1EBDE"/><path d="M22 30 L26 30" stroke="#F1EBDE" stroke-width="1.6"/></svg>
      <svg class="b24" viewBox="0 0 48 48"><rect width="48" height="48" fill="#3F4A24"/><g fill="none" stroke="#F1EBDE" stroke-width="2.6" stroke-linejoin="miter" stroke-linecap="square"><path d="M14 16 L8 10 M34 16 L40 10"/><path d="M16 18 L24 15 L32 18 L31 30 L24 36 L17 30 Z"/></g><circle cx="20.5" cy="24" r="1.7" fill="#F1EBDE"/><circle cx="27.5" cy="24" r="1.7" fill="#F1EBDE"/></svg>
      <svg class="b16" viewBox="0 0 48 48"><rect width="48" height="48" fill="#3F4A24"/><g fill="none" stroke="#F1EBDE" stroke-width="3.4" stroke-linejoin="miter"><path d="M14 16 L8 10 M34 16 L40 10"/><path d="M16 18 L24 15 L32 18 L31 30 L24 36 L17 30 Z"/></g></svg>
      <span class="tag">64 · 24 · 16</span>
    </div>
    <div class="lock"><svg viewBox="0 0 48 48"><rect width="48" height="48" fill="#3F4A24"/><g fill="none" stroke="#F1EBDE" stroke-width="2" stroke-linejoin="miter" stroke-linecap="square"><path d="M14 16 L8 10 M34 16 L40 10"/><path d="M14 16 L18 20 L14 24 L10 22 Z" fill="#F1EBDE"/><path d="M34 16 L30 20 L34 24 L38 22 Z" fill="#F1EBDE"/><path d="M16 18 L24 15 L32 18 L31 30 L24 36 L17 30 Z"/></g><circle cx="20.5" cy="24" r="1.4" fill="#F1EBDE"/><circle cx="27.5" cy="24" r="1.4" fill="#F1EBDE"/></svg><div><div class="word">Praça Araguaia</div><div class="wsub">Cotações do agro</div></div></div>
  </div>

</div>
</body></html>
